<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unblocked Games</title>
    <meta name="description" content="A fast and clean unblocked games and apps portal with playable iframe games and web apps stored in a JSON database." />
    <meta property="og:title" content="Unblocked Games" />
    <meta property="og:description" content="A fast and clean unblocked games and apps portal with playable iframe games and web apps stored in a JSON database." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" />
    <script>
      // Automatic fallback for GitHub Pages when deploying from repository root:
      // Redirects to compiled /docs/ bundle so uncompiled JSX in src/ is never loaded directly.
      if (window.location.hostname.includes('github.io') && !window.location.pathname.includes('/docs/')) {
        var base = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        window.location.replace(base + '/docs/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
