<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      width: 360px;
      height: 520px;
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      border: 2px solid #334155;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #70c5ce;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .btn {
      background: #eab308;
      color: #422006;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .score-hud {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="score" class="score-hud">0</div>
    <canvas id="game" width="360" height="520"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ov-title" style="font-size: 26px; color: #fde047;">FLAPPY BIRD</h2>
      <p id="ov-sub" style="font-size: 14px; color: #cbd5e1;">Press Space, Click, or Tap to Flap</p>
      <button id="start-btn" class="btn">Play</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovSub = document.getElementById('ov-sub');
    const startBtn = document.getElementById('start-btn');

    let bird = { x: 70, y: 250, r: 14, vy: 0, gravity: 0.38, jump: -6.5 };
    let pipes = [];
    let frame = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('flappy_high') || '0');
    let isRunning = false;

    function resetGame() {
      bird = { x: 70, y: 240, r: 14, vy: 0, gravity: 0.38, jump: -6.5 };
      pipes = [];
      score = 0;
      frame = 0;
      scoreEl.textContent = '0';
      overlay.style.display = 'none';
      isRunning = true;
    }

    function gameOver() {
      isRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappy_high', highScore);
      }
      ovTitle.textContent = 'Game Over!';
      ovSub.innerHTML = `Score: <b>${score}</b> | Best: <b>${highScore}</b>`;
      startBtn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    function flap() {
      if (!isRunning) {
        if (overlay.style.display !== 'none') resetGame();
        return;
      }
      bird.vy = bird.jump;
    }

    function update() {
      if (!isRunning) return;
      frame++;
      bird.vy += bird.gravity;
      bird.y += bird.vy;

      // Pipe generation
      if (frame % 95 === 0) {
        const gap = 130;
        const minTop = 60;
        const maxTop = canvas.height - gap - 90;
        const topH = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
        pipes.push({
          x: canvas.width,
          w: 52,
          topH: topH,
          bottomY: topH + gap,
          passed: false
        });
      }

      // Update pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.4;

        // Score
        if (!p.passed && p.x + p.w < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
        }

        // Collision
        if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w) {
          if (bird.y - bird.r < p.topH || bird.y + bird.r > p.bottomY) {
            return gameOver();
          }
        }

        if (p.x + p.w < 0) {
          pipes.splice(i, 1);
        }
      }

      // Floor & ceiling
      if (bird.y + bird.r >= canvas.height - 40 || bird.y - bird.r <= 0) {
        return gameOver();
      }
    }

    function draw() {
      // Sky
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(80, 120, 24, 0, Math.PI * 2);
      ctx.arc(110, 110, 30, 0, Math.PI * 2);
      ctx.arc(140, 120, 22, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      for (let p of pipes) {
        ctx.fillStyle = '#22c55e';
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3;

        // Top pipe
        ctx.fillRect(p.x, 0, p.w, p.topH);
        ctx.strokeRect(p.x, 0, p.w, p.topH);
        ctx.fillRect(p.x - 4, p.topH - 22, p.w + 8, 22);
        ctx.strokeRect(p.x - 4, p.topH - 22, p.w + 8, 22);

        // Bottom pipe
        const botH = canvas.height - 40 - p.bottomY;
        ctx.fillRect(p.x, p.bottomY, p.w, botH);
        ctx.strokeRect(p.x, p.bottomY, p.w, botH);
        ctx.fillRect(p.x - 4, p.bottomY, p.w + 8, 22);
        ctx.strokeRect(p.x - 4, p.bottomY, p.w + 8, 22);
      }

      // Ground
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 10);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 10)));
      ctx.rotate(angle);

      // Body
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -5, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(8, -5, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(18, 4);
      ctx.lineTo(8, 8);
      ctx.closePath();
      ctx.fill();

      // Wing
      ctx.fillStyle = '#ca8a04';
      ctx.beginPath();
      ctx.ellipse(-6, 2, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target !== startBtn) {
        flap();
      }
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetGame();
    });

    loop();
  </script>
</body>
</html>
