<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
    }
    .stat-box {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .stat-val { color: #22c55e; font-size: 18px; font-weight: bold; }
    #canvas-wrap {
      position: relative;
      width: 400px;
      height: 400px;
      max-width: 92vw;
      max-height: 92vw;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      gap: 12px;
    }
    .overlay h2 { font-size: 26px; color: #f1f5f9; }
    .overlay p { font-size: 14px; color: #94a3b8; }
    .btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:hover { background: #16a34a; }
    .btn:active { transform: scale(0.96); }
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 48px);
      gap: 8px;
      margin-top: 14px;
    }
    @media (max-pointer: coarse), (max-width: 500px) {
      .touch-controls { display: grid; }
    }
    .t-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 8px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .t-btn:active { background: #334155; }
  </style>
</head>
<body>
  <div class="header">
    <div class="stat-box">Score: <span id="score" class="stat-val">0</span></div>
    <div class="stat-box">Best: <span id="high-score" class="stat-val">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="msg-title">Retro Snake</h2>
      <p id="msg-sub">Use Arrow Keys or WASD to navigate</p>
      <button id="start-btn" class="btn">Play Game</button>
    </div>
  </div>

  <div class="touch-controls">
    <div></div>
    <button class="t-btn" id="btn-up">▲</button>
    <div></div>
    <button class="t-btn" id="btn-left">◀</button>
    <button class="t-btn" id="btn-down">▼</button>
    <button class="t-btn" id="btn-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const msgTitle = document.getElementById('msg-title');
    const msgSub = document.getElementById('msg-sub');
    const startBtn = document.getElementById('start-btn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 10};
    let dx = 0, dy = 0;
    let nextDx = 0, nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_high') || '0');
    highScoreEl.textContent = highScore;
    let gameLoop = null;
    let isRunning = false;

    function playTone(freq, type = 'sine', duration = 0.08) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * TILE_COUNT),
          y: Math.floor(Math.random() * TILE_COUNT)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function startGame() {
      snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreEl.textContent = score;
      spawnFood();
      overlay.style.display = 'none';
      isRunning = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playTone(150, 'sawtooth', 0.3);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_high', highScore);
        highScoreEl.textContent = highScore;
      }
      msgTitle.textContent = 'Game Over!';
      msgSub.textContent = `Score: ${score} - Best: ${highScore}`;
      startBtn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    function update() {
      dx = nextDx;
      dy = nextDy;
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playTone(550, 'triangle', 0.1);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = '#0f172a';
      for (let x = 0; x < canvas.width; x += GRID_SIZE) {
        for (let y = 0; y < canvas.height; y += GRID_SIZE) {
          ctx.fillRect(x, y, 1, 1);
        }
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#22c55e';
          ctx.shadowColor = '#22c55e';
          ctx.shadowBlur = 6;
        } else {
          ctx.fillStyle = '#16a34a';
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.roundRect(
          part.x * GRID_SIZE + 1.5,
          part.y * GRID_SIZE + 1.5,
          GRID_SIZE - 3,
          GRID_SIZE - 3,
          index === 0 ? 5 : 3
        );
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function setDirection(newDx, newDy) {
      if (!isRunning) return;
      if (newDx !== -dx && newDy !== -dy) {
        nextDx = newDx;
        nextDy = newDy;
      }
    }

    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault(); setDirection(0, -1); break;
        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault(); setDirection(0, 1); break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          e.preventDefault(); setDirection(-1, 0); break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          e.preventDefault(); setDirection(1, 0); break;
        case ' ':
          if (!isRunning) startGame();
          break;
      }
    });

    startBtn.addEventListener('click', startGame);
    document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));

    draw();
  </script>
</body>
</html>
