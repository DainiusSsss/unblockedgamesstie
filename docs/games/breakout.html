<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brick Smasher Deluxe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 440px;
      max-width: 95vw;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 600;
    }
    .hud span { color: #f59e0b; }
    #wrap {
      position: relative;
      width: 440px;
      height: 480px;
      max-width: 95vw;
      max-height: 85vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      gap: 12px;
    }
    .btn {
      background: #f59e0b;
      color: #451a03;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">❤❤❤</span></div>
    <div>LEVEL: <span id="level">1</span></div>
  </div>

  <div id="wrap">
    <canvas id="game" width="440" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ov-title" style="color: #f59e0b; font-size: 24px;">BRICK SMASHER</h2>
      <p style="color: #94a3b8; font-size: 13px; text-align: center;">Move mouse, touch, or Left/Right arrows to control paddle</p>
      <button id="start-btn" class="btn">Play Game</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const startBtn = document.getElementById('start-btn');

    let isRunning = false;
    let score = 0;
    let lives = 3;
    let level = 1;

    let paddle = { x: 180, y: 445, w: 80, h: 12, speed: 7 };
    let ball = { x: 220, y: 430, r: 6, vx: 3.5, vy: -3.5, inPlay: false };
    let bricks = [];
    let keys = {};

    const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#8b5cf6'];

    function initBricks() {
      bricks = [];
      const rows = 5;
      const cols = 8;
      const brickW = 46;
      const brickH = 16;
      const offsetX = 24;
      const offsetY = 45;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: offsetX + c * (brickW + 5),
            y: offsetY + r * (brickH + 6),
            w: brickW,
            h: brickH,
            color: COLORS[r % COLORS.length],
            points: (rows - r) * 10,
            alive: true
          });
        }
      }
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * (3 + level * 0.4);
      ball.vy = -(3.5 + level * 0.4);
      ball.inPlay = false;
    }

    function startGame() {
      score = 0;
      lives = 3;
      level = 1;
      scoreEl.textContent = '0';
      livesEl.textContent = '❤❤❤';
      levelEl.textContent = '1';
      paddle.x = canvas.width / 2 - paddle.w / 2;
      initBricks();
      resetBall();
      overlay.style.display = 'none';
      isRunning = true;
      requestAnimationFrame(loop);
    }

    function gameOver(win = false) {
      isRunning = false;
      ovTitle.textContent = win ? 'YOU WIN!' : 'GAME OVER';
      ovTitle.style.color = win ? '#22c55e' : '#ef4444';
      startBtn.textContent = 'Play Again';
      overlay.style.display = 'flex';
    }

    function update() {
      if (!isRunning) return;

      // Move paddle with keys
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

      if (!ball.inPlay) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 2;
        return;
      }

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall collision
      if (ball.x - ball.r <= 0 || ball.x + ball.r >= canvas.width) {
        ball.vx = -ball.vx;
      }
      if (ball.y - ball.r <= 0) {
        ball.vy = -ball.vy;
      }

      // Paddle collision
      if (ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x && ball.x <= paddle.x + paddle.w && ball.vy > 0) {
        ball.vy = -Math.abs(ball.vy);
        const hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hitOffset * 5.5;
      }

      // Brick collision
      for (let b of bricks) {
        if (b.alive) {
          if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
              ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
            b.alive = false;
            ball.vy = -ball.vy;
            score += b.points;
            scoreEl.textContent = score;
            break;
          }
        }
      }

      // Next level check
      if (bricks.every(b => !b.alive)) {
        level++;
        levelEl.textContent = level;
        initBricks();
        resetBall();
        return;
      }

      // Lost ball
      if (ball.y - ball.r > canvas.height) {
        lives--;
        livesEl.textContent = '❤'.repeat(Math.max(0, lives));
        if (lives <= 0) {
          return gameOver(false);
        } else {
          resetBall();
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      for (let b of bricks) {
        if (b.alive) {
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 3);
          ctx.fill();
        }
      }

      // Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      if (!ball.inPlay && isRunning) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Click or press Space to launch ball', canvas.width / 2, paddle.y - 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function launch() {
      if (isRunning && !ball.inPlay) ball.inPlay = true;
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.code === 'Space') launch();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mx = (e.clientX - rect.left) * scaleX;
      paddle.x = mx - paddle.w / 2;
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mx = (e.touches[0].clientX - rect.left) * scaleX;
      paddle.x = mx - paddle.w / 2;
    }, { passive: false });

    canvas.addEventListener('click', launch);
    startBtn.addEventListener('click', startGame);

    draw();
  </script>
</body>
</html>
