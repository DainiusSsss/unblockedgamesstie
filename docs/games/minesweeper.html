<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .window {
      background: #cbd5e1;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border: 3px solid #94a3b8;
    }
    .header {
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 2px inset #334155;
    }
    .digit-box {
      font-family: monospace;
      font-size: 26px;
      font-weight: 800;
      color: #ef4444;
      background: #000;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 65px;
      text-align: center;
      letter-spacing: 2px;
    }
    .face-btn {
      font-size: 26px;
      background: #e2e8f0;
      border: 2px outset #f1f5f9;
      border-radius: 6px;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:active { border-style: inset; }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 32px);
      grid-template-rows: repeat(9, 32px);
      gap: 2px;
      background: #64748b;
      padding: 3px;
      border: 3px inset #475569;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #cbd5e1;
      border: 3px outset #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .cell.revealed {
      background: #e2e8f0;
      border: 1px solid #94a3b8;
      cursor: default;
    }
    .cell.mine { background: #f87171 !important; }
    .flag-toggle {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .mode-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .mode-btn.active { background: #3b82f6; border-color: #60a5fa; }
    .c-1 { color: #2563eb; }
    .c-2 { color: #16a34a; }
    .c-3 { color: #dc2626; }
    .c-4 { color: #7c3aed; }
    .c-5 { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="window">
    <div class="header">
      <div id="mine-count" class="digit-box">010</div>
      <button id="face-btn" class="face-btn">😊</button>
      <div id="timer" class="digit-box">000</div>
    </div>
    <div id="grid" class="grid"></div>
    <div class="flag-toggle">
      <button id="mode-dig" class="mode-btn active">⛏ Dig</button>
      <button id="mode-flag" class="mode-btn">🚩 Flag Mode</button>
    </div>
  </div>

  <script>
    const ROWS = 9, COLS = 9, MINES = 10;
    let board = [];
    let isGameOver = false;
    let timer = 0, timerInterval = null;
    let flagMode = false;
    let flagsLeft = MINES;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face-btn');
    const modeDig = document.getElementById('mode-dig');
    const modeFlag = document.getElementById('mode-flag');

    function formatDigits(n) {
      return String(Math.max(0, Math.min(999, n))).padStart(3, '0');
    }

    function initBoard() {
      board = [];
      isGameOver = false;
      timer = 0;
      flagsLeft = MINES;
      mineCountEl.textContent = formatDigits(flagsLeft);
      timerEl.textContent = '000';
      faceBtn.textContent = '😊';
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = { mine: false, revealed: false, flagged: false, count: 0 };
        }
      }

      // Place mines
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].mine) {
          board[r][c].mine = true;
          placed++;
        }
      }

      // Calculate neighbor numbers
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }

      render();
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board[r][c];
          const div = document.createElement('div');
          div.className = 'cell';
          if (cell.revealed) {
            div.classList.add('revealed');
            if (cell.mine) {
              div.classList.add('mine');
              div.textContent = '💣';
            } else if (cell.count > 0) {
              div.textContent = cell.count;
              div.classList.add(`c-${cell.count}`);
            }
          } else if (cell.flagged) {
            div.textContent = '🚩';
          }

          div.addEventListener('click', (e) => handleClick(r, c, false));
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleClick(r, c, true);
          });
          gridEl.appendChild(div);
        }
      }
    }

    function startTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          timer++;
          timerEl.textContent = formatDigits(timer);
        }, 1000);
      }
    }

    function reveal(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      if (cell.mine) {
        gameOver(false);
        return;
      }

      if (cell.count === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            reveal(r + dr, c + dc);
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine && !board[r][c].revealed) unrevealedSafe++;
        }
      }
      if (unrevealedSafe === 0) {
        gameOver(true);
      }
    }

    function gameOver(win) {
      isGameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = win ? '😎' : '😵';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) board[r][c].revealed = true;
        }
      }
      render();
    }

    function handleClick(r, c, forceFlag) {
      if (isGameOver) return;
      startTimer();
      const cell = board[r][c];

      if (forceFlag || flagMode) {
        if (!cell.revealed) {
          cell.flagged = !cell.flagged;
          flagsLeft += cell.flagged ? -1 : 1;
          mineCountEl.textContent = formatDigits(flagsLeft);
          render();
        }
        return;
      }

      if (!cell.flagged) {
        reveal(r, c);
        if (!isGameOver) checkWin();
        render();
      }
    }

    faceBtn.addEventListener('click', initBoard);
    modeDig.addEventListener('click', () => {
      flagMode = false;
      modeDig.classList.add('active');
      modeFlag.classList.remove('active');
    });
    modeFlag.addEventListener('click', () => {
      flagMode = true;
      modeFlag.classList.add('active');
      modeDig.classList.remove('active');
    });

    initBoard();
  </script>
</body>
</html>
