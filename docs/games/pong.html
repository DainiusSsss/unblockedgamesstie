<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Pong DX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      width: 500px;
      height: 380px;
      max-width: 95vw;
      max-height: 85vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #030712;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.6);
    }
    .score-board {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 50px;
      font-size: 32px;
      font-weight: bold;
      color: #38bdf8;
      pointer-events: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      gap: 12px;
    }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      background: #0ea5e9;
      color: #031c30;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="score-board">
      <span id="p1-score">0</span>
      <span id="p2-score">0</span>
    </div>
    <canvas id="game" width="500" height="380"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="ov-title" style="font-size: 26px; color: #38bdf8;">NEON PONG</h2>
      <p style="font-size: 13px; color: #94a3b8; text-align: center;">Move mouse / touch paddle up and down<br>First to 7 wins!</p>
      <div class="btn-row">
        <button id="btn-vs-ai" class="btn">1 Player (vs AI)</button>
        <button id="btn-vs-player" class="btn" style="background: #a855f7; color: #fff;">2 Player Local</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');

    let isRunning = false;
    let is2Player = false;
    let p1Score = 0, p2Score = 0;

    const paddleW = 12, paddleH = 70;
    let p1 = { x: 15, y: 155, dy: 0 };
    let p2 = { x: canvas.width - 27, y: 155, dy: 0 };

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 6,
      vx: 4,
      vy: 3,
      speed: 5
    };

    let keys = {};

    function resetBall(winner) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 5;
      const angle = (Math.random() * 0.8 - 0.4);
      const dir = winner === 1 ? -1 : 1;
      ball.vx = dir * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    function startGame(twoPlayerMode) {
      is2Player = twoPlayerMode;
      p1Score = 0; p2Score = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      p1.y = 155; p2.y = 155;
      resetBall(1);
      overlay.style.display = 'none';
      isRunning = true;
    }

    function checkWin() {
      if (p1Score >= 7 || p2Score >= 7) {
        isRunning = false;
        ovTitle.textContent = p1Score >= 7 ? 'Player 1 Wins!' : (is2Player ? 'Player 2 Wins!' : 'Computer Wins!');
        overlay.style.display = 'flex';
      }
    }

    function update() {
      if (!isRunning) return;

      // Player 1 controls (W/S or Up/Down or touch)
      if (keys['w'] || keys['W'] || (!is2Player && keys['ArrowUp'])) p1.y -= 6;
      if (keys['s'] || keys['S'] || (!is2Player && keys['ArrowDown'])) p1.y += 6;

      // Player 2 / AI controls
      if (is2Player) {
        if (keys['ArrowUp']) p2.y -= 6;
        if (keys['ArrowDown']) p2.y += 6;
      } else {
        // AI smoothing
        const target = ball.y - paddleH / 2;
        p2.y += (target - p2.y) * 0.085;
      }

      // Constrain paddles
      p1.y = Math.max(5, Math.min(canvas.height - paddleH - 5, p1.y));
      p2.y = Math.max(5, Math.min(canvas.height - paddleH - 5, p2.y));

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/Bottom bounce
      if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
        ball.vy = -ball.vy;
      }

      // Left paddle hit
      if (ball.x - ball.r <= p1.x + paddleW && ball.x + ball.r >= p1.x &&
          ball.y >= p1.y && ball.y <= p1.y + paddleH && ball.vx < 0) {
        ball.vx = -ball.vx;
        const impact = (ball.y - (p1.y + paddleH / 2)) / (paddleH / 2);
        ball.vy = impact * 4;
        ball.speed = Math.min(10, ball.speed + 0.3);
      }

      // Right paddle hit
      if (ball.x + ball.r >= p2.x && ball.x - ball.r <= p2.x + paddleW &&
          ball.y >= p2.y && ball.y <= p2.y + paddleH && ball.vx > 0) {
        ball.vx = -ball.vx;
        const impact = (ball.y - (p2.y + paddleH / 2)) / (paddleH / 2);
        ball.vy = impact * 4;
        ball.speed = Math.min(10, ball.speed + 0.3);
      }

      // Score check
      if (ball.x < 0) {
        p2Score++;
        p2ScoreEl.textContent = p2Score;
        resetBall(2);
        checkWin();
      } else if (ball.x > canvas.width) {
        p1Score++;
        p1ScoreEl.textContent = p1Score;
        resetBall(1);
        checkWin();
      }
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center divider
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p1.x, p1.y, paddleW, paddleH);

      ctx.fillStyle = is2Player ? '#a855f7' : '#ef4444';
      ctx.fillRect(p2.x, p2.y, paddleW, paddleH);

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      const my = (e.clientY - rect.top) * scaleY;
      p1.y = my - paddleH / 2;
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      const my = (e.touches[0].clientY - rect.top) * scaleY;
      p1.y = my - paddleH / 2;
    }, { passive: false });

    document.getElementById('btn-vs-ai').addEventListener('click', () => startGame(false));
    document.getElementById('btn-vs-player').addEventListener('click', () => startGame(true));

    loop();
  </script>
</body>
</html>
