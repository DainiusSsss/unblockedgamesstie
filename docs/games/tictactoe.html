<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .title { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .mode-bar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      justify-content: center;
    }
    .m-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .m-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .status {
      font-size: 16px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 16px;
      height: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-template-rows: repeat(3, 90px);
      gap: 10px;
      background: #1e293b;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .cell {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cell:hover { background: #1e293b; }
    .cell.x { color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.6); }
    .cell.o { color: #f43f5e; text-shadow: 0 0 12px rgba(244, 63, 94, 0.6); }
    .btn-reset {
      margin-top: 20px;
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">TIC-TAC-TOE</div>
    <div class="mode-bar">
      <button id="mode-ai" class="m-btn active">vs AI</button>
      <button id="mode-2p" class="m-btn">2 Player</button>
    </div>
  </div>

  <div id="status" class="status">Player X's Turn</div>

  <div id="grid" class="grid">
    <div class="cell" data-idx="0"></div>
    <div class="cell" data-idx="1"></div>
    <div class="cell" data-idx="2"></div>
    <div class="cell" data-idx="3"></div>
    <div class="cell" data-idx="4"></div>
    <div class="cell" data-idx="5"></div>
    <div class="cell" data-idx="6"></div>
    <div class="cell" data-idx="7"></div>
    <div class="cell" data-idx="8"></div>
  </div>

  <button id="reset-btn" class="btn-reset">Restart Match</button>

  <script>
    let board = Array(9).fill(null);
    let turn = 'X';
    let vsAI = true;
    let gameOver = false;

    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');
    const modeAi = document.getElementById('mode-ai');
    const mode2p = document.getElementById('mode-2p');

    const WIN_PATTERNS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function checkWinner(b) {
      for (let p of WIN_PATTERNS) {
        if (b[p[0]] && b[p[0]] === b[p[1]] && b[p[0]] === b[p[2]]) {
          return b[p[0]];
        }
      }
      if (b.every(c => c !== null)) return 'draw';
      return null;
    }

    function render() {
      cells.forEach((cell, i) => {
        cell.textContent = board[i] || '';
        cell.className = 'cell' + (board[i] ? ` ${board[i].toLowerCase()}` : '');
      });
    }

    function minimax(b, depth, isMaximizing) {
      const winner = checkWinner(b);
      if (winner === 'O') return 10 - depth;
      if (winner === 'X') return depth - 10;
      if (winner === 'draw') return 0;

      if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = 'O';
            best = Math.max(best, minimax(b, depth + 1, false));
            b[i] = null;
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = 'X';
            best = Math.min(best, minimax(b, depth + 1, true));
            b[i] = null;
          }
        }
        return best;
      }
    }

    function aiMove() {
      let bestScore = -Infinity;
      let move = -1;
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          const score = minimax(board, 0, false);
          board[i] = null;
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      if (move !== -1) {
        board[move] = 'O';
        const winner = checkWinner(board);
        if (winner) {
          endGame(winner);
        } else {
          turn = 'X';
          statusEl.textContent = "Player X's Turn";
        }
        render();
      }
    }

    function endGame(winner) {
      gameOver = true;
      if (winner === 'draw') {
        statusEl.textContent = "It's a Draw!";
      } else {
        statusEl.textContent = `Player ${winner} Wins! 🎉`;
      }
    }

    function handleCellClick(i) {
      if (board[i] || gameOver) return;

      board[i] = turn;
      render();
      const winner = checkWinner(board);
      if (winner) {
        return endGame(winner);
      }

      if (vsAI) {
        turn = 'O';
        statusEl.textContent = "AI is thinking...";
        setTimeout(aiMove, 250);
      } else {
        turn = turn === 'X' ? 'O' : 'X';
        statusEl.textContent = `Player ${turn}'s Turn`;
      }
    }

    function reset() {
      board = Array(9).fill(null);
      turn = 'X';
      gameOver = false;
      statusEl.textContent = "Player X's Turn";
      render();
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        handleCellClick(parseInt(cell.dataset.idx));
      });
    });

    modeAi.addEventListener('click', () => {
      vsAI = true;
      modeAi.classList.add('active');
      mode2p.classList.remove('active');
      reset();
    });

    mode2p.addEventListener('click', () => {
      vsAI = false;
      mode2p.classList.add('active');
      modeAi.classList.remove('active');
      reset();
    });

    resetBtn.addEventListener('click', reset);
  </script>
</body>
</html>
